<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #df171d;
      --navy: #07133f;
      --paper: #fffdf8;
      --soft-red: #fce9e9;
      --ink: #101010;
      --rule: #171717;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: var(--navy);
    }

    h1 {
      font-family: "Poppins", "DM Sans", sans-serif;
    }

    .arc-dot-field {
      background-color: var(--paper);
      background-image: radial-gradient(circle, rgba(223, 23, 29, 0.9) 2.2px, transparent 2.45px);
      background-size: 19px 19px;
    }

    .arc-wash {
      background: radial-gradient(circle at center, rgba(255, 253, 248, 0.98) 0%, rgba(255, 253, 248, 0.94) 42%, rgba(255, 253, 248, 0.75) 100%);
    }

    .rise-in {
      animation: rise-in 0.72s cubic-bezier(.22,.8,.3,1) both;
    }

    .rise-delay-1 { animation-delay: 0.10s; }
    .rise-delay-2 { animation-delay: 0.20s; }
    .rise-delay-3 { animation-delay: 0.30s; }
    .rise-delay-4 { animation-delay: 0.40s; }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .focus-ring:focus-visible {
      outline: 3px solid #f1a4a7;
      outline-offset: 4px;
    }

    /* Shared design language, reused (with each page's own accent
       colors) on NEXUS and CORE: sharp corners, a hard offset shadow
       instead of a soft blurred one, and a small "lift" toward the
       viewer on hover/focus. */
    .arc-action,
    .arc-logo {
      position: relative;
      border: 1px solid var(--rule);
      border-radius: 6px;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .arc-action:hover,
    .arc-action:focus-visible,
    .arc-logo:hover,
    .arc-logo:focus-within {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--ink);
    }

    .arc-logo {
      overflow: hidden;
    }

    .arc-logo img {
      display: block;
      filter: contrast(1.08);
      transition: transform 500ms ease, filter 500ms ease;
    }

    .arc-logo:hover img,
    .arc-logo:focus-within img {
      transform: scale(1.045);
      filter: contrast(1.2);
    }

    .signature-watermark {
      position: fixed;
      right: clamp(.8rem, 2.4vw, 1.8rem);
      bottom: clamp(.6rem, 2vw, 1.4rem);
      width: clamp(96px, 12vw, 150px);
      height: auto;
      opacity: .38;
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }
    @media (max-width: 560px) {
      .signature-watermark { width: 84px; opacity: .3; }
    }

    /* Password widget (matches NEXUS/CORE design language) */
    .password-row {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .password-widget {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle {
      flex: 0 0 auto;
      min-width: 148px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      background: #df171d;
      color: #fff;
      cursor: pointer;
      border: 1px solid var(--rule);
      border-radius: 6px;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 180ms ease, box-shadow 180ms ease, background-color 0.3s ease;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .password-toggle:not(.is-unlocked) { background: #df171d !important; color: #fff !important; }
    .password-toggle:hover, .password-toggle:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--ink);
    }
    .password-toggle.is-unlocked { background: #fff !important; border-color: var(--rule) !important; color: var(--navy) !important; box-shadow: 5px 5px 0 var(--ink); }
    .password-toggle svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Intermittent bounce animation for locked state */
    .password-toggle.bounce {
      animation: pw-bounce 4s ease-in-out infinite;
    }
    @keyframes pw-bounce {
      0%, 100% { transform: translateY(0); }
      5% { transform: translateY(-4px); }
      10% { transform: translateY(0); }
      15% { transform: translateY(-3px); }
      20% { transform: translateY(0); }
      25% { transform: translateY(-2px); }
      30% { transform: translateY(0); }
    }

    .password-panel {
      width: 0;
      overflow: hidden;
      transition: width .25s ease, margin .25s ease;
      margin: 0;
      text-align: center;
    }
    .password-widget.is-open .password-panel { 
      width: var(--pw-width, 220px); 
      margin: 0 auto;
    }

    .password-input {
      width: 100%;
      height: 48px;
      padding: 0 1rem;
      border: 1px solid rgba(223,23,29,.35);
      border-radius: 6px;
      background: #fff;
      color: var(--navy);
      font-weight: 700;
      font-size: 14px;
      outline: 0;
      transition: box-shadow .18s ease;
      text-align: center;
    }
    .password-input:not(:placeholder-shown) {
      box-shadow: 0 0 0 3px rgba(223,23,29,.14), 0 8px 18px rgba(223,23,29,.18);
    }
    .password-input.is-wrong { animation: pw-shake .32s ease; border-color: #ff8f9a; }
    @keyframes pw-shake {
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .lock-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      background: var(--navy);
      color: #fff;
      padding: .6rem 1rem;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 50;
      box-shadow: 0 10px 24px rgba(0,0,0,.3);
    }
    .lock-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    /* Grayscale lock overlay */
    .page-locked {
      filter: grayscale(100%);
      transition: filter 0.5s ease;
    }
    .page-unlocked {
      filter: grayscale(0%);
      transition: filter 0.5s ease;
    }
  </style>
 </head>
 <body class="w-full overflow-x-hidden" style="background: rgb(255, 253, 248);">
  <main class="arc-dot-field relative flex min-h-screen w-full items-center justify-center overflow-hidden px-5 py-12 sm:px-8">
   <div class="arc-wash absolute inset-0"></div>
   <section class="relative z-10 mx-auto flex w-full max-w-4xl flex-col items-center text-center">
    <div class="page-filterable">
     <div class="rise-in flex justify-center">
      <div class="arc-logo flex h-36 w-36 items-center justify-center bg-white p-3 sm:h-44 sm:w-44">
       <img loading="lazy" class="h-full w-full object-contain" src="assets/logo.png" alt="Ateneo de Naga College Red Cross Youth Council logo">
      </div>
     </div>
<p class="rise-in rise-delay-1 mt-7 w-full text-base font-bold uppercase tracking-[0.15em] sm:text-lg text-center" style="color: rgb(223, 23, 29);">Ateneo de Naga College Red Cross Youth Council</p>
      <div class="rise-in rise-delay-2 mt-8 h-px w-16 bg-[#df171d] mx-auto"></div>
     <h1 class="rise-in rise-delay-2 mt-7 max-w-3xl" style="color: rgb(7, 19, 63); font-weight: 900; font-size: 38px; letter-spacing: -0.02rem; line-height: 1.05;">Welcome to ARC</h1>
     <p class="rise-in rise-delay-3 mt-5 max-w-2xl leading-relaxed" style="color: rgb(76, 83, 103); font-size: 19px; line-height: 1.6;">Your central space for council operations, shared deliverables, and quick-access files that help us efficiently serve with purpose.</p>
    </div>
    <div class="password-row rise-in rise-delay-4 mt-10">
      <div class="password-widget" id="passwordWidget">
        <button id="passwordToggle" class="password-toggle bounce arc-action" type="button" aria-expanded="false" aria-label="Unlock access" style="background:#df171d;color:#fff;"><i data-lucide="lock" aria-hidden="true" width="18" height="18"></i><span>Unlock</span></button>
        <div class="password-panel"><input id="passwordInput" type="password" class="password-input" placeholder="Input Password" autocomplete="off" spellcheck="false"></div>
      </div>
    </div>
    <div class="page-filterable">
     <nav class="rise-in rise-delay-4 mt-6 flex w-full flex-col justify-center gap-3 sm:flex-row sm:flex-wrap" aria-label="ARC destinations">
      <a class="arc-action focus-ring inline-flex min-w-[190px] items-center justify-center gap-2 px-5 py-4 text-sm font-bold uppercase tracking-[0.08em]" href="NEXUS.html" style="background: rgb(223, 23, 29); color: rgb(255, 255, 255);">
       <i data-lucide="qr-code" width="18" height="18" aria-hidden="true"></i>
       <span>NEXUS</span>
      </a>
      <a class="arc-action focus-ring inline-flex min-w-[190px] items-center justify-center gap-2 px-5 py-4 text-sm font-bold uppercase tracking-[0.08em]" href="https://red-cross-scheduler.vercel.app/" target="_blank" rel="noopener noreferrer" style="background: rgb(7, 19, 63); color: rgb(255, 255, 255);">
       <i data-lucide="clipboard-list" width="18" height="18" aria-hidden="true"></i>
       <span>Tracker</span>
      </a>
      <a class="arc-action focus-ring inline-flex min-w-[190px] items-center justify-center gap-2 px-5 py-[14px] text-sm font-bold uppercase tracking-[0.08em]" href="core.html" style="background: rgb(255, 253, 248); color: rgb(7, 19, 63);">
       <i data-lucide="list-checks" width="18" height="18" aria-hidden="true"></i>
       <span>CORE</span>
      </a>
     </nav>
     <footer class="rise-in rise-delay-4 mt-12">
      <p class="text-xs font-bold uppercase tracking-[0.15em]" style="color: rgb(7, 19, 63); letter-spacing: 0.1rem;">Always First • Always Ready • Always There</p>
     </footer>
    </div>
   </section>
  </main>
  <img class="signature-watermark" src="assets/signature-watermark.png" alt="" aria-hidden="true">
  <script>
    // ---------- Homepage Authentication & Grayscale Lock ----------
    const CORRECT_PASSWORD = "medbag1";
    let isLocked = true;

    const passwordWidget = document.getElementById("passwordWidget");
    const passwordToggle = document.getElementById("passwordToggle");
    const passwordInput = document.getElementById("passwordInput");
    const navButtons = document.querySelectorAll("nav a.arc-action");
    const pageFilterable = document.querySelectorAll(".page-filterable");

    function flashLockedNotice(message) {
      let toast = document.getElementById("lockToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "lockToast";
        toast.className = "lock-toast";
        document.body.appendChild(toast);
      }
      toast.textContent = message || "Enter password to unlock.";
      toast.classList.add("is-visible");
      clearTimeout(flashLockedNotice._t);
      flashLockedNotice._t = setTimeout(() => toast.classList.remove("is-visible"), 2200);
    }

    function updateLockUI() {
      passwordToggle.classList.toggle("is-unlocked", !isLocked);
      passwordToggle.setAttribute("aria-label", isLocked ? "Unlock access" : "Lock access");
      passwordToggle.innerHTML = isLocked
        ? '<i data-lucide="lock" aria-hidden="true" width="18" height="18"></i><span>Unlock</span>'
        : '<i data-lucide="unlock" aria-hidden="true" width="18" height="18"></i><span>Lock</span>';
      passwordToggle.classList.toggle("bounce", isLocked);
      lucide.createIcons();
    }

    function collapsePasswordWidget() {
      passwordWidget.classList.remove("is-open");
      passwordToggle.setAttribute("aria-expanded", "false");
      passwordInput.value = "";
      passwordInput.blur();
    }

    function openPasswordWidget() {
      // Compact fixed width for the input (more sleek than full nav group width)
      const compactWidth = 320;
      passwordWidget.style.setProperty("--pw-width", `${compactWidth}px`);
      passwordWidget.classList.add("is-open");
      passwordToggle.setAttribute("aria-expanded", "true");
      passwordInput.focus({ preventScroll: true });
    }

    function setLocked(locked) {
      isLocked = locked;
      updateLockUI();
      
      // Apply grayscale filter to page content — but not to the auth
      // button itself, which lives outside .page-filterable specifically
      // so it stays in full, high-contrast color as the active call to
      // action while everything else is desaturated.
      if (locked) {
        pageFilterable.forEach(el => { el.classList.add("page-locked"); el.classList.remove("page-unlocked"); });
        navButtons.forEach(btn => {
          btn.style.pointerEvents = "none";
          btn.style.opacity = "0.5";
        });
      } else {
        pageFilterable.forEach(el => { el.classList.remove("page-locked"); el.classList.add("page-unlocked"); });
        navButtons.forEach(btn => {
          btn.style.pointerEvents = "";
          btn.style.opacity = "";
        });
      }
      
      // Persist to sessionStorage
      sessionStorage.setItem("arc_homepage_unlocked", locked ? "false" : "true");
    }

    // Check sessionStorage on load
    function checkAuthState() {
      const stored = sessionStorage.getItem("arc_homepage_unlocked");
      if (stored === "true") {
        isLocked = false;
      }
      setLocked(isLocked);
    }

    passwordToggle.addEventListener("click", () => {
      if (isLocked) {
        openPasswordWidget();
      } else {
        setLocked(true);
        collapsePasswordWidget();
        showStatus("Access locked.");
      }
    });

    passwordInput.addEventListener("input", () => {
      if (passwordInput.value === CORRECT_PASSWORD) {
        setLocked(false);
        collapsePasswordWidget();
        showStatus("Access unlocked.");
      }
    });

    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && passwordInput.value && passwordInput.value !== CORRECT_PASSWORD) {
        passwordInput.classList.add("is-wrong");
        setTimeout(() => passwordInput.classList.remove("is-wrong"), 350);
        passwordInput.value = "";
      }
      if (event.key === "Escape") collapsePasswordWidget();
    });

    document.addEventListener("click", (event) => {
      if (passwordWidget.classList.contains("is-open") && !passwordWidget.contains(event.target)) {
        collapsePasswordWidget();
      }
    });

    // Prevent navigation clicks when locked
    navButtons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (isLocked) {
          e.preventDefault();
          flashLockedNotice();
        }
      });
    });

    function showStatus(message) {
      flashLockedNotice(message);
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkAuthState();
    });
  </script>
 </body>
</html>
